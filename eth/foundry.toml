[profile.default]
fs_permissions = [{ access = "read", path = "./" }]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.39"
# votes pushed the unoptimized runtime to 21.7 KB, too close to the 24 KB limit
optimizer = true
optimizer_runs = 200
# solc hits stack too deep on RealProof only, keep the deployed bytecode off via-ir
additional_compiler_profiles = [{ name = "via-ir", via_ir = true }]
compilation_restrictions = [{ paths = "test/RealProof.t.sol", via_ir = true }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[fuzz]
runs = 100

[invariant]
runs = 32
depth = 100
# a handler revert means a proven kid could not be claimed
fail_on_revert = true
